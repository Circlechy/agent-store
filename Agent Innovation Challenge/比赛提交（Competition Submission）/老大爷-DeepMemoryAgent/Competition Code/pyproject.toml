[project]
name = "deep-memory"
version = "0.1.0"
description = "MCP server for processing and managing memory files"
requires-python = ">=3.12"
dependencies = [
    "mcp>=0.9.0",
    "fastmcp>=0.1.0",
    "openjiuwen>=0.1.3",
    "pydantic>=2.0.0",
    "pytest>=9.0.2",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
