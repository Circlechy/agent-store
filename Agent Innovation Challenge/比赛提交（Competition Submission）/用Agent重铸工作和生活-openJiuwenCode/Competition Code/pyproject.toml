[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-code"
version = "0.2.0"
description = "openjiuwen-code - AI 编程助手（基于 openJiuwen SDK）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "openjiuwen-code team", email = "contact@example.com"}
]
keywords = ["ai", "agent", "coding", "assistant", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # 核心：openJiuwen agent-core SDK
    "openjiuwen>=0.1.0",

    # CLI 和 UI
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",

    # 异步支持
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",

    # 文件操作
    "watchdog>=3.0.0",

    # 配置管理
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # LLM 提供商
    "anthropic>=0.18.0",
    "openai>=1.12.0",

    # Web 工具
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "mypy>=1.8.0",
    "flake8>=6.1.0",
    "types-PyYAML>=6.0.12",
    "types-aiofiles>=23.2.0",
]

[project.urls]
Homepage = "https://github.com/your-org/openjiuwen-code"
Documentation = "https://github.com/your-org/openjiuwen-code/docs"
Repository = "https://github.com/your-org/openjiuwen-code"

[project.scripts]
jiuwen = "packages.cli.main:main"

[tool.setuptools]
packages = ["packages.server", "packages.cli", "packages.lsp"]

[tool.setuptools.package-data]
"packages.server" = ["config/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "scenario_l1: L1 simple scenario tests",
    "scenario_l2: L2 medium scenario tests",
    "scenario_l3: L3 complex scenario tests",
    "scenario_l4: L4 expert scenario tests",
    "scenario_special: Special scenario tests",
    "claude_code_parity: Claude Code parity tests",
    "e2e: End-to-end tests (requires API key)",
    "slow: Slow tests that call real LLM",
    "super_agent: Super Agent demo tests (complex multi-step workflows)",
    "sub_agent: Sub Agent (Task tool) tests",
    "network: Tests that require network access",
    "workflow: Workflow tests (create, edit, search, refactor, bug fix)",
    "plan_mode: Plan mode tests",
    "demo: Demo recording scenario tests (DEMO_RECORDING_GUIDE.md)",
]
