        // 删除记录
        async function deleteRecord(date, timestamp) {
            if (!confirm('确定要删除这条记录吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/work-records/${date}/${timestamp}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '删除失败');
                }
                
                showMessage('记录已删除', 'success');
                
                // 重新加载记录
                setTimeout(() => {
                    loadRecords();
                }, 500);
            } catch (error) {
                console.error('删除记录错误:', error);
                showMessage(`删除失败: ${error.message}`, 'error');
            }
        }

        // 加载工作记录
        let lastRecordsCount = 0;  // 记录上次加载的记录数量
        let lastRecordsHash = '';  // 记录上次加载的记录哈希值（用于检测变化）
        
        async function loadRecords(silent = false) {
            // 如果正在编辑，跳过更新，避免打断用户编辑
            if (isEditing) {
                return;
            }
            
            // 使用记录日历的选中日期，如果没有则使用今天
            const selectedDate = recordCalendarState.selectedDate || new Date().toISOString().split('T')[0];
            const container = document.getElementById('records-container');

            if (!silent) {
            container.innerHTML = '<div class="loading">正在加载工作记录...</div>';
            }

            try {
                // 尝试从本地文件系统加载（开发模式）
                const dateStr = selectedDate || new Date().toISOString().split('T')[0];
                const response = await fetch(`/work_records/${dateStr}.json`);

                if (!response.ok) {
                    throw new Error('文件不存在');
                }

                const records = await response.json();
                
                if (!Array.isArray(records) || records.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p>该日期暂无工作记录</p>
                        </div>
                    `;
                    lastRecordsCount = 0;
                    lastRecordsHash = '';
                    return;
                }

                // 按时间倒序排列
                records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                // 计算记录哈希值（使用最新几条记录的时间戳）
                const recordsHash = records.slice(0, 5).map(r => r.timestamp).join('|');
                
                // 检查是否有新记录
                const hasNewRecords = records.length > lastRecordsCount || recordsHash !== lastRecordsHash;
                
                // 更新记录
                container.innerHTML = records.map(record => renderRecordCard(record)).join('');
                
                // 刷新有记录的日期列表（如果当前日期有记录，确保它在列表中）
                if (records.length > 0 && !recordCalendarState.datesWithRecords.includes(dateStr)) {
                    recordCalendarState.datesWithRecords.push(dateStr);
                    recordCalendarState.datesWithRecords.sort();
                    // 重新渲染日历以显示新的小圆点
                    renderRecordCalendar();
                }
                
                // 如果有新记录且不是静默更新，滚动到顶部显示新内容
                if (hasNewRecords && !silent && lastRecordsCount > 0) {
                    container.scrollTop = 0;
                }
                
                lastRecordsCount = records.length;
                lastRecordsHash = recordsHash;
            } catch (error) {
                console.error('加载错误:', error);
                // 尝试使用API加载
                try {
                    const dateStr = selectedDate || new Date().toISOString().split('T')[0];
                    const response = await fetch(`/api/work-records?date=${dateStr}`);
                    
                    if (response.ok) {
                        const records = await response.json();
                        if (Array.isArray(records) && records.length > 0) {
                            records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                            
                            // 检查是否有新记录
                            const recordsHash = records.slice(0, 5).map(r => r.timestamp).join('|');
                            const hasNewRecords = records.length > lastRecordsCount || recordsHash !== lastRecordsHash;
                            
                            container.innerHTML = records.map(record => renderRecordCard(record)).join('');
                            
                            // 刷新有记录的日期列表
                            if (records.length > 0 && !recordCalendarState.datesWithRecords.includes(dateStr)) {
                                recordCalendarState.datesWithRecords.push(dateStr);
                                recordCalendarState.datesWithRecords.sort();
                                renderRecordCalendar();
                            }
                            
                            if (hasNewRecords && !silent && lastRecordsCount > 0) {
                                container.scrollTop = 0;
                            }
                            
                            lastRecordsCount = records.length;
                            lastRecordsHash = recordsHash;
                            return;
                        }
                    }
                } catch (apiError) {
                    console.error('API错误:', apiError);
                }
                if (!silent) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>该日期暂无工作记录</p>
                        <p style="font-size: 12px; margin-top: 8px; color: #999;">提示：请确保后端服务正在运行</p>
                    </div>
                `;
                }
            }
        }
        
        // 定时轮询检查新记录（每5秒检查一次）
        let recordsPollInterval = null;
        let isEditing = false;  // 标记是否正在编辑
        
        function startRecordsPolling() {
            // 如果已经有轮询，先清除
            if (recordsPollInterval) {
                clearInterval(recordsPollInterval);
            }
            
            // 每5秒检查一次新记录
            recordsPollInterval = setInterval(() => {
                // 如果正在编辑，跳过更新
                if (!isEditing) {
                    loadRecords(true);  // silent=true，静默更新，不显示加载提示
                }
            }, 5000);
        }
        
        function stopRecordsPolling() {
            if (recordsPollInterval) {
                clearInterval(recordsPollInterval);
                recordsPollInterval = null;
            }
        }

        // 工作记录日历状态
        let recordCalendarState = {
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            selectedDate: null,
            datesWithRecords: []  // 有记录的日期列表
        };

        // 报告生成日历状态
        let calendarState = {
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            startDate: null,
            endDate: null,
            selectingStart: true,
            datesWithRecords: []  // 有记录的日期列表
        };

        // 初始化工作记录日历
        async function initRecordCalendar() {
            // 加载有记录的日期列表
            await loadDatesWithRecords();
            renderRecordCalendar();
            // 点击外部关闭日历
            document.addEventListener('click', (e) => {
                const calendar = document.getElementById('record-calendar-dropdown');
                const trigger = document.getElementById('record-calendar-trigger');
                if (calendar && !calendar.contains(e.target) && !trigger.contains(e.target)) {
                    calendar.classList.remove('show');
                    if (trigger) trigger.classList.remove('active');
                }
            });
        }

        // 加载有记录的日期列表
        async function loadDatesWithRecords() {
            try {
                const response = await fetch('/api/work-records/dates');
                if (response.ok) {
                    recordCalendarState.datesWithRecords = await response.json();
                }
            } catch (error) {
                console.error('加载日期列表失败:', error);
                recordCalendarState.datesWithRecords = [];
            }
        }

        // 切换工作记录日历显示
        function toggleRecordCalendar() {
            const dropdown = document.getElementById('record-calendar-dropdown');
            const trigger = document.getElementById('record-calendar-trigger');
            if (dropdown && trigger) {
                dropdown.classList.toggle('show');
                trigger.classList.toggle('active');
                if (dropdown.classList.contains('show')) {
                    renderRecordCalendar();
                }
            }
        }

        // 切换工作记录月份
        function changeRecordMonth(delta) {
            recordCalendarState.currentMonth += delta;
            if (recordCalendarState.currentMonth < 0) {
                recordCalendarState.currentMonth = 11;
                recordCalendarState.currentYear--;
            } else if (recordCalendarState.currentMonth > 11) {
                recordCalendarState.currentMonth = 0;
                recordCalendarState.currentYear++;
            }
            renderRecordCalendar();
        }

        // 渲染工作记录日历
        function renderRecordCalendar() {
            const year = recordCalendarState.currentYear;
            const month = recordCalendarState.currentMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();

            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            const monthYearEl = document.getElementById('record-calendar-month-year');
            if (monthYearEl) {
                monthYearEl.textContent = `${year}年 ${monthNames[month]}`;
            }

            const calendarDays = document.getElementById('record-calendar-days');
            if (!calendarDays) return;
            calendarDays.innerHTML = '';

            // 上个月的日期
            const prevMonth = month === 0 ? 11 : month - 1;
            const prevYear = month === 0 ? year - 1 : year;
            const prevMonthLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();

            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const dayEl = createRecordDayElement(prevYear, prevMonth, day, true);
                calendarDays.appendChild(dayEl);
            }

            // 当前月的日期
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
                const dayEl = createRecordDayElement(year, month, day, false, isToday);
                calendarDays.appendChild(dayEl);
            }

            // 下个月的日期（填满6行）
            const totalCells = calendarDays.children.length;
            const remainingCells = 42 - totalCells;
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextYear = month === 11 ? year + 1 : year;

            for (let day = 1; day <= remainingCells; day++) {
                const dayEl = createRecordDayElement(nextYear, nextMonth, day, true);
                calendarDays.appendChild(dayEl);
            }
        }

        // 创建工作记录日期元素
        function createRecordDayElement(year, month, day, isOtherMonth, isToday = false) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;

            const dateStr = formatDate(year, month, day);
            const date = new Date(year, month, day);

            if (isOtherMonth) {
                dayEl.classList.add('other-month');
            }

            if (isToday) {
                dayEl.classList.add('today');
            }

            // 检查是否有记录
            if (recordCalendarState.datesWithRecords.includes(dateStr)) {
                dayEl.classList.add('has-record');
            }

            // 检查是否选中
            if (recordCalendarState.selectedDate && dateStr === recordCalendarState.selectedDate) {
                dayEl.classList.add('selected');
            }

            dayEl.onclick = () => selectRecordDate(year, month, day);
            return dayEl;
        }

        // 选择工作记录日期
        function selectRecordDate(year, month, day) {
            const dateStr = formatDate(year, month, day);
            recordCalendarState.selectedDate = dateStr;
            updateRecordCalendarDisplay();
            renderRecordCalendar();
        }

        // 更新工作记录日历显示
        function updateRecordCalendarDisplay() {
            const display = document.getElementById('record-calendar-display');
            if (display) {
                if (recordCalendarState.selectedDate) {
                    display.textContent = recordCalendarState.selectedDate;
                    display.classList.remove('empty');
                } else {
                    display.textContent = '点击选择日期';
                    display.classList.add('empty');
                }
            }
        }

        // 清除工作记录日期
        function clearRecordDate() {
            recordCalendarState.selectedDate = null;
            updateRecordCalendarDisplay();
            renderRecordCalendar();
        }

        // 确认工作记录日期
        function confirmRecordDate() {
            if (recordCalendarState.selectedDate) {
                updateRecordCalendarDisplay();
                toggleRecordCalendar();
                // 加载选中日期的记录
                loadRecords();
            } else {
                showMessage('请选择一个日期', 'error');
            }
        }

        // 初始化报告生成日历
        async function initCalendar() {
            // 加载有记录的日期列表
            await loadCalendarDatesWithRecords();
            renderCalendar();
            // 点击外部关闭日历
            document.addEventListener('click', (e) => {
                const calendar = document.getElementById('calendar-dropdown');
                const trigger = document.getElementById('calendar-trigger');
                if (calendar && !calendar.contains(e.target) && !trigger.contains(e.target)) {
                    calendar.classList.remove('show');
                    if (trigger) trigger.classList.remove('active');
                }
            });
        }

        // 加载报告生成日历有记录的日期列表
        async function loadCalendarDatesWithRecords() {
            try {
                const response = await fetch('/api/work-records/dates');
                if (response.ok) {
                    calendarState.datesWithRecords = await response.json();
                }
            } catch (error) {
                console.error('加载日期列表失败:', error);
                calendarState.datesWithRecords = [];
            }
        }

        // 切换日历显示
        async function toggleCalendar() {
            const dropdown = document.getElementById('calendar-dropdown');
            const trigger = document.getElementById('calendar-trigger');
            dropdown.classList.toggle('show');
            trigger.classList.toggle('active');
            if (dropdown.classList.contains('show')) {
                // 如果日期列表为空，先加载
                if (calendarState.datesWithRecords.length === 0) {
                    await loadCalendarDatesWithRecords();
                }
                renderCalendar();
            }
        }

        // 切换月份
        function changeMonth(delta) {
            calendarState.currentMonth += delta;
            if (calendarState.currentMonth < 0) {
                calendarState.currentMonth = 11;
                calendarState.currentYear--;
            } else if (calendarState.currentMonth > 11) {
                calendarState.currentMonth = 0;
                calendarState.currentYear++;
            }
            renderCalendar();
        }

        // 渲染日历
        function renderCalendar() {
            const year = calendarState.currentYear;
            const month = calendarState.currentMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();

            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('calendar-month-year').textContent = `${year}年 ${monthNames[month]}`;

            const calendarDays = document.getElementById('calendar-days');
            calendarDays.innerHTML = '';

            // 上个月的日期
            const prevMonth = month === 0 ? 11 : month - 1;
            const prevYear = month === 0 ? year - 1 : year;
            const prevMonthLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();

            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const dateStr = formatDate(prevYear, prevMonth, day);
                const dayEl = createDayElement(prevYear, prevMonth, day, true);
                calendarDays.appendChild(dayEl);
            }

            // 当前月的日期
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
                const dayEl = createDayElement(year, month, day, false, isToday);
                calendarDays.appendChild(dayEl);
            }

            // 下个月的日期（填满6行）
            const totalCells = calendarDays.children.length;
            const remainingCells = 42 - totalCells; // 6行 x 7列 = 42
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextYear = month === 11 ? year + 1 : year;

            for (let day = 1; day <= remainingCells; day++) {
                const dayEl = createDayElement(nextYear, nextMonth, day, true);
                calendarDays.appendChild(dayEl);
            }
        }

        // 创建日期元素
        function createDayElement(year, month, day, isOtherMonth, isToday = false) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;

            const dateStr = formatDate(year, month, day);
            const date = new Date(year, month, day);

            if (isOtherMonth) {
                dayEl.classList.add('other-month');
            }

            if (isToday) {
                dayEl.classList.add('today');
            }

            // 检查是否有记录
            if (calendarState.datesWithRecords.includes(dateStr)) {
                dayEl.classList.add('has-record');
            }

            // 检查是否在选中范围内
            if (calendarState.startDate && calendarState.endDate) {
                if (dateStr === calendarState.startDate) {
                    dayEl.classList.add('range-start');
                } else if (dateStr === calendarState.endDate) {
                    dayEl.classList.add('range-end');
                } else if (dateStr > calendarState.startDate && dateStr < calendarState.endDate) {
                    dayEl.classList.add('in-range');
                }
            } else if (calendarState.startDate && dateStr === calendarState.startDate) {
                dayEl.classList.add('selected');
            }

            dayEl.onclick = () => selectDate(year, month, day);
            return dayEl;
        }

        // 选择日期
        function selectDate(year, month, day) {
            const dateStr = formatDate(year, month, day);

            if (calendarState.selectingStart || !calendarState.startDate) {
                // 选择开始日期
                calendarState.startDate = dateStr;
                calendarState.endDate = null;
                calendarState.selectingStart = false;
            } else {
                // 选择结束日期
                if (dateStr < calendarState.startDate) {
                    // 如果选择的日期早于开始日期，交换它们
                    calendarState.endDate = calendarState.startDate;
                    calendarState.startDate = dateStr;
                } else {
                    calendarState.endDate = dateStr;
                }
                calendarState.selectingStart = true;
            }

            updateCalendarDisplay();
            renderCalendar();
        }

        // 格式化日期
        function formatDate(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        // 更新日历显示
        function updateCalendarDisplay() {
            const display = document.getElementById('calendar-display');
            if (calendarState.startDate && calendarState.endDate) {
                if (calendarState.startDate === calendarState.endDate) {
                    display.textContent = calendarState.startDate;
                } else {
                    display.textContent = `${calendarState.startDate} 至 ${calendarState.endDate}`;
                }
                display.classList.remove('empty');
            } else if (calendarState.startDate) {
                display.textContent = `${calendarState.startDate} (选择结束日期)`;
                display.classList.remove('empty');
            } else {
                display.textContent = '点击选择日期范围';
                display.classList.add('empty');
            }
        }

        // 清除日期范围
        function clearDateRange() {
            calendarState.startDate = null;
            calendarState.endDate = null;
            calendarState.selectingStart = true;
            updateCalendarDisplay();
            renderCalendar();
        }

        // 确认日期范围
        function confirmDateRange() {
            if (calendarState.startDate) {
                if (!calendarState.endDate) {
                    calendarState.endDate = calendarState.startDate;
                }
                updateCalendarDisplay();
                toggleCalendar();
            } else {
                showMessage('请至少选择一个日期', 'error');
            }
        }

        // 生成报告
        async function generateReport() {
            const startDate = calendarState.startDate;
            const endDate = calendarState.endDate || calendarState.startDate;
            const reportContent = document.getElementById('report-content');

            if (!startDate) {
                showMessage('请选择日期范围', 'error');
                return;
            }

            try {
                reportContent.innerHTML = `
                    <div class="loading loading-generating">
                        <div class="loading-generating-text">正在生成报告...</div>
                        <div class="loading-spinner"></div>
                    </div>
                `;
                reportContent.classList.remove('empty');

                const finalEndDate = endDate || startDate;
                const response = await fetch(`/api/work-records/summary?start_date=${startDate}&end_date=${finalEndDate}`);
                
                if (response.ok) {
                    const summary = await response.json();
                    displayReport(summary, startDate, finalEndDate);
                } else {
                    const error = await response.json();
                    throw new Error(error.error || '生成报告失败');
                }
            } catch (error) {
                console.error('生成报告错误:', error);
                reportContent.innerHTML = `
                    <div class="empty">
                        <p>报告生成失败</p>
                        <p style="font-size: 11px; color: #999; margin-top: 8px;">${error.message}</p>
                    </div>
                `;
                reportContent.classList.add('empty');
            }
        }

        // 保存当前报告数据
        let currentReportData = null;
        let currentReportDates = { startDate: null, endDate: null };

        // 显示报告内容
        function displayReport(summary, startDate, endDate) {
            const reportContent = document.getElementById('report-content');
            reportContent.classList.remove('empty');

            // 保存报告数据
            currentReportData = summary;
            currentReportDates = { startDate, endDate };

            // 添加日期范围信息
            const dateRange = startDate === endDate ? startDate : `${startDate} 至 ${endDate}`;
            const recordCount = summary.metadata?.record_count || 0;
            const daysDiff = Math.ceil((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1;
            
            let html = `<div class="report-header">
                <div class="report-header-info">
                    <h3 class="report-header-title">${icon('calendar')} ${dateRange}</h3>
                    <p class="report-header-meta">共 ${recordCount} 条记录，${daysDiff} 天</p>
                </div>
                <div class="report-actions">
                    <button class="report-action-btn" onclick="editReport()" title="编辑报告">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        编辑
                    </button>
                    <button class="report-action-btn" onclick="downloadReport()" title="下载为Markdown">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        下载
                    </button>
                </div>
            </div>`;
            
            // 添加编辑表单（默认隐藏）
            html += generateEditForm(summary);
            
            if (summary.tasks && summary.tasks.length > 0) {
                html += '<div class="report-section">';
                html += '<h3>主要任务</h3><ul>';
                summary.tasks.forEach(task => {
                    html += `<li>${task}</li>`;
                });
                html += '</ul></div>';
            }

            if (summary.work_content && Array.isArray(summary.work_content) && summary.work_content.length > 0) {
                html += '<div class="report-section">';
                html += '<h3>工作内容</h3><ul>';
                summary.work_content.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += '</ul></div>';
            }

            if (summary.achievements && Array.isArray(summary.achievements) && summary.achievements.length > 0) {
                html += '<div class="report-section">';
                html += '<h3>取得成果</h3><ul>';
                summary.achievements.forEach(ach => {
                    // 支持向后兼容：如果是对象格式，提取文本；否则直接显示
                    let achText = '';
                    if (typeof ach === 'object' && ach !== null && !Array.isArray(ach)) {
                        if (ach.description) {
                            achText = ach.description;
                        } else if (ach.title) {
                            achText = ach.title;
                        } else {
                            achText = JSON.stringify(ach);
                        }
                    } else {
                        achText = String(ach);
                    }
                    html += `<li>${achText}</li>`;
                });
                html += '</ul></div>';
            }

            if (summary.issues && summary.issues.length > 0) {
                html += '<div class="report-section">';
                html += '<h3>遇到问题</h3><ul>';
                summary.issues.forEach(issue => {
                    html += `<li>${issue}</li>`;
                });
                html += '</ul></div>';
            }

            if (summary.next_steps && summary.next_steps.length > 0) {
                html += '<div class="report-section">';
                html += '<h3>下一步计划</h3><ul>';
                summary.next_steps.forEach(step => {
                    html += `<li>${step}</li>`;
                });
                html += '</ul></div>';
            }

            reportContent.innerHTML = html || '<div class="empty"><p>暂无报告内容</p></div>';
        }

        // 生成编辑表单
        function generateEditForm(summary) {
            const tasks = summary.tasks || [];
            const achievements = summary.achievements || [];
            const issues = summary.issues || [];
            const nextSteps = summary.next_steps || [];
            
            let formHtml = `<div class="report-edit-form" id="report-edit-form">
                <h4 style="margin: 0 0 16px 0; color: #667eea;">编辑报告</h4>
                
                <div class="report-edit-form-group">
                    <label>主要任务：</label>
                    <ul id="edit-tasks">
                        ${tasks.map((task, index) => `
                            <li>
                                <input type="text" value="${escapeHtml(task)}" data-index="${index}">
                                <button type="button" onclick="removeEditItem('tasks', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                            </li>
                        `).join('')}
                    </ul>
                    <button type="button" onclick="addEditItem('tasks')" style="margin-top: 8px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">+ 添加任务</button>
                </div>
                
                <div class="report-edit-form-group">
                    <label>工作内容：</label>
                    <ul id="edit-work-content">
                        ${(Array.isArray(summary.work_content) ? summary.work_content : []).map((item, index) => `
                            <li>
                                <input type="text" value="${escapeHtml(item)}" data-index="${index}">
                                <button type="button" onclick="removeEditItem('work-content', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                            </li>
                        `).join('')}
                    </ul>
                    <button type="button" onclick="addEditItem('work-content')" style="margin-top: 8px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">+ 添加工作内容</button>
                </div>
                
                <div class="report-edit-form-group">
                    <label>取得成果：</label>
                    <ul id="edit-achievements">
                        ${achievements.map((ach, index) => {
                            // 支持向后兼容：如果是对象格式，提取文本；否则直接使用
                            let achText = '';
                            if (typeof ach === 'object' && ach !== null && !Array.isArray(ach)) {
                                achText = ach.description || ach.title || '';
                            } else {
                                achText = String(ach);
                            }
                            return `
                                <li>
                                    <input type="text" value="${escapeHtml(achText)}" data-index="${index}">
                                    <button type="button" onclick="removeEditItem('achievements', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                    <button type="button" onclick="addEditItem('achievements')" style="margin-top: 8px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">+ 添加成果</button>
                </div>
                
                <div class="report-edit-form-group">
                    <label>遇到问题：</label>
                    <ul id="edit-issues">
                        ${issues.map((issue, index) => `
                            <li>
                                <input type="text" value="${escapeHtml(issue)}" data-index="${index}">
                                <button type="button" onclick="removeEditItem('issues', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                            </li>
                        `).join('')}
                    </ul>
                    <button type="button" onclick="addEditItem('issues')" style="margin-top: 8px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">+ 添加问题</button>
                </div>
                
                <div class="report-edit-form-group">
                    <label>下一步计划：</label>
                    <ul id="edit-next-steps">
                        ${nextSteps.map((step, index) => `
                            <li>
                                <input type="text" value="${escapeHtml(step)}" data-index="${index}">
                                <button type="button" onclick="removeEditItem('next-steps', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                            </li>
                        `).join('')}
                    </ul>
                    <button type="button" onclick="addEditItem('next-steps')" style="margin-top: 8px; padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">+ 添加计划</button>
                </div>
                
                <div class="report-edit-form-actions">
                    <button type="button" onclick="cancelEditReport()" style="padding: 8px 16px; background: #e0e0e0; color: #666; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">取消</button>
                    <button type="button" onclick="saveEditReport()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">保存</button>
                </div>
            </div>`;
            
            return formHtml;
        }

        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 编辑报告
        function editReport() {
            const editForm = document.getElementById('report-edit-form');
            if (editForm) {
                editForm.classList.add('active');
                editForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 取消编辑
        function cancelEditReport() {
            const editForm = document.getElementById('report-edit-form');
            if (editForm) {
                editForm.classList.remove('active');
            }
        }

        // 保存编辑
        function saveEditReport() {
            if (!currentReportData) return;
            
            // 收集编辑后的数据
            const editedData = { ...currentReportData };
            
            // 收集任务
            const taskInputs = document.querySelectorAll('#edit-tasks input[type="text"]');
            editedData.tasks = Array.from(taskInputs)
                .map(input => input.value.trim())
                .filter(value => value);
            
            // 收集工作内容
            const workContentInputs = document.querySelectorAll('#edit-work-content input[type="text"]');
            editedData.work_content = Array.from(workContentInputs)
                .map(input => input.value.trim())
                .filter(value => value);
            
            // 收集成果（现在是单个输入框）
            const achievementInputs = document.querySelectorAll('#edit-achievements input[type="text"]');
            editedData.achievements = Array.from(achievementInputs)
                .map(input => input.value.trim())
                .filter(value => value);
            
            // 收集问题
            const issueInputs = document.querySelectorAll('#edit-issues input[type="text"]');
            editedData.issues = Array.from(issueInputs)
                .map(input => input.value.trim())
                .filter(value => value);
            
            // 收集下一步计划
            const nextStepInputs = document.querySelectorAll('#edit-next-steps input[type="text"]');
            editedData.next_steps = Array.from(nextStepInputs)
                .map(input => input.value.trim())
                .filter(value => value);
            
            // 更新报告数据并重新显示
            currentReportData = editedData;
            displayReport(editedData, currentReportDates.startDate, currentReportDates.endDate);
            showMessage('报告已更新', 'success');
        }

        // 添加编辑项
        function addEditItem(type) {
            const listId = `edit-${type}`;
            const list = document.getElementById(listId);
            if (!list) return;
            
            const index = list.children.length;
            const itemHtml = `
                <li>
                    <input type="text" placeholder="请输入内容" data-index="${index}">
                    <button type="button" onclick="removeEditItem('${type}', ${index})" style="padding: 4px 8px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">删除</button>
                </li>
            `;
            
            list.insertAdjacentHTML('beforeend', itemHtml);
        }

        // 删除编辑项
        function removeEditItem(type, index) {
            const listId = `edit-${type}`;
            const list = document.getElementById(listId);
            if (!list) return;
            
            const items = list.querySelectorAll('li');
            if (items[index]) {
                items[index].remove();
            }
        }

        // 下载报告（Markdown格式）
        function downloadReport() {
            if (!currentReportData) {
                showMessage('没有可下载的报告', 'error');
                return;
            }
            
            const { startDate, endDate } = currentReportDates;
            const dateRange = startDate === endDate ? startDate : `${startDate}_${endDate}`;
            const filename = `工作报告_${dateRange}`;
            
            const markdown = generateMarkdown(currentReportData, startDate, endDate);
            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 生成Markdown格式
        function generateMarkdown(summary, startDate, endDate) {
            const dateRange = startDate === endDate ? startDate : `${startDate} 至 ${endDate}`;
            const recordCount = summary.metadata?.record_count || 0;
            const daysDiff = Math.ceil((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1;
            
            let md = `# 工作报告\n\n`;
            md += `**日期范围：** ${dateRange}\n\n`;
            md += `**统计信息：** 共 ${recordCount} 条记录，${daysDiff} 天\n\n`;
            md += `---\n\n`;
            
            if (summary.tasks && summary.tasks.length > 0) {
                md += `## 主要任务\n\n`;
                summary.tasks.forEach(task => {
                    md += `- ${task}\n`;
                });
                md += `\n`;
            }
            
            if (summary.work_content && Array.isArray(summary.work_content) && summary.work_content.length > 0) {
                md += `## 工作内容\n\n`;
                summary.work_content.forEach(item => {
                    md += `- ${item}\n`;
                });
                md += `\n`;
            }
            
            if (summary.achievements && Array.isArray(summary.achievements) && summary.achievements.length > 0) {
                md += `## 取得成果\n\n`;
                summary.achievements.forEach(ach => {
                    // 支持向后兼容：如果是对象格式，提取文本；否则直接使用
                    let achText = '';
                    if (typeof ach === 'object' && ach !== null && !Array.isArray(ach)) {
                        achText = ach.description || ach.title || '';
                    } else {
                        achText = String(ach);
                    }
                    if (achText) {
                        md += `- ${achText}\n`;
                    }
                });
                md += `\n`;
            }
            
            if (summary.issues && summary.issues.length > 0) {
                md += `## 遇到问题\n\n`;
                summary.issues.forEach(issue => {
                    md += `- ${issue}\n`;
                });
                md += `\n`;
            }
            
            if (summary.next_steps && summary.next_steps.length > 0) {
                md += `## 下一步计划\n\n`;
                summary.next_steps.forEach(step => {
                    md += `- ${step}\n`;
                });
                md += `\n`;
            }
            
            return md;
        }

        // 倒计时状态
        let countdownTimer = null;
        let countdownSeconds = 0;

        // 请求浏览器通知权限
        async function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                await Notification.requestPermission();
            }
        }

        // 显示浏览器通知
        function showNotification(title, body, tag = 'screenshot') {
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    const notification = new Notification(title, {
                        body: body,
                        tag: tag,
                        icon: '/favicon.ico', // 使用网站图标
                        requireInteraction: false
                    });
                    
                    // 点击通知时聚焦到页面
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };
                    
                    // 3秒后自动关闭
                    setTimeout(() => notification.close(), 3000);
                } catch (e) {
                    console.warn('通知显示失败:', e);
                }
            }
        }

        // 启动自动截图（带倒计时）
        async function startAutoScreenshot() {
            console.log('startAutoScreenshot 被调用');
            try {
                const intervalInput = document.getElementById('screenshot-interval');
                const startBtn = document.getElementById('start-auto-btn');
                const statusEl = document.getElementById('auto-screenshot-status');
                
                console.log('DOM元素检查:', { intervalInput, startBtn, statusEl });
                
                if (!intervalInput || !startBtn || !statusEl) {
                    console.error('找不到必要的DOM元素');
                    showMessage('页面元素加载失败，请刷新页面重试', 'error');
                    return;
                }
                
                const interval = parseInt(intervalInput.value);
                const originalText = startBtn.textContent || '启动';
                
                console.log('间隔值:', interval);
                
                if (!interval || isNaN(interval) || interval < 1) {
                    showMessage('截图间隔至少1秒', 'error');
                    return;
                }

                // 如果已有倒计时，取消它
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }

                // 请求通知权限（不阻塞）
                requestNotificationPermission().catch(err => {
                    console.warn('请求通知权限失败:', err);
                });

                // 倒计时3秒
                countdownSeconds = 3;
                startBtn.disabled = true;
                startBtn.textContent = `将在 ${countdownSeconds} 秒后开始...`;
                statusEl.innerHTML = `${icon('loading')} 准备启动 (${countdownSeconds}秒后开始)`;
                statusEl.style.color = '#ff9800';
                statusEl.style.fontWeight = '500';
                
                console.log('倒计时开始');

                countdownTimer = setInterval(() => {
                    countdownSeconds--;
                    if (countdownSeconds > 0) {
                        startBtn.textContent = `将在 ${countdownSeconds} 秒后开始...`;
                        statusEl.innerHTML = `${icon('loading')} 准备启动 (${countdownSeconds}秒后开始)`;
                    } else {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        console.log('倒计时结束，开始启动截图');
                        // 倒计时结束，真正启动
                        actuallyStartAutoScreenshot(interval, startBtn, originalText);
                    }
                }, 1000);
            } catch (error) {
                console.error('启动自动截图错误:', error);
                showMessage(`启动失败: ${error.message}`, 'error');
            }
        }

        // 真正启动自动截图
        async function actuallyStartAutoScreenshot(interval, startBtn, originalText) {
            try {
                startBtn.textContent = '启动中...';
                
                const response = await fetch('/api/screenshot/auto/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ interval })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '启动失败');
                }

                const result = await response.json();
                updateAutoScreenshotUI(true, interval);
                
                // 格式化间隔时间显示
                const minutes = Math.floor(interval / 60);
                const seconds = interval % 60;
                let intervalText = '';
                if (minutes > 0) {
                    intervalText = `${minutes}分钟`;
                    if (seconds > 0) {
                        intervalText += `${seconds}秒`;
                    }
                } else {
                    intervalText = `${seconds}秒`;
                }
                
                showMessage(`自动截图已启动，间隔: ${intervalText}`, 'success');
                
                // 显示浏览器通知
                showNotification(
                    '自动截图已启动',
                    `截图间隔: ${intervalText}`,
                    'screenshot-started'
                );
            } catch (error) {
                console.error('启动自动截图错误:', error);
                showMessage(`启动失败: ${error.message}`, 'error');
                // 恢复按钮状态
                if (startBtn) {
                    startBtn.disabled = false;
                    startBtn.textContent = originalText;
                }
                const statusEl = document.getElementById('auto-screenshot-status');
                statusEl.textContent = '⚪ 未启用';
                statusEl.style.color = '#999';
            }
        }

        // 停止自动截图
        async function stopAutoScreenshot() {
            console.log('stopAutoScreenshot 被调用');
            
            // 如果正在倒计时，取消倒计时
            if (countdownTimer) {
                console.log('取消倒计时');
                clearInterval(countdownTimer);
                countdownTimer = null;
                const startBtn = document.getElementById('start-auto-btn');
                const statusEl = document.getElementById('auto-screenshot-status');
                if (startBtn) {
                    startBtn.disabled = false;
                    startBtn.textContent = '启动';
                }
                if (statusEl) {
                    statusEl.textContent = '⚪ 未启用';
                    statusEl.style.color = '#999';
                }
                showMessage('已取消启动', 'success');
                return;
            }

            const stopBtn = document.getElementById('stop-auto-btn');
            const originalText = stopBtn ? stopBtn.textContent : '';
            
            console.log('准备停止截图，按钮状态:', {
                stopBtn: !!stopBtn,
                display: stopBtn?.style.display,
                visible: stopBtn?.offsetParent !== null
            });
            
            try {
                // 显示加载状态
                if (stopBtn) {
                    stopBtn.disabled = true;
                    stopBtn.textContent = '停止中...';
                }
                
                console.log('发送停止请求到后端');
                const response = await fetch('/api/screenshot/auto/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                console.log('后端响应:', response.status, response.statusText);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: '未知错误' }));
                    console.error('停止失败，错误信息:', errorData);
                    throw new Error(errorData.error || '停止失败');
                }

                const result = await response.json();
                console.log('停止成功，结果:', result);
                
                updateAutoScreenshotUI(false, 0);
                
                // 显示统计信息
                if (result.stats) {
                    const stats = result.stats;
                    updateScreenshotStats(stats);
                    
                    const totalCaptured = stats.total_captured || 0;
                    const processing = stats.processing || 0;
                    const processed = stats.processed || 0;
                    const duration = stats.session_duration || 0;
                    
                    let message = `自动截图已停止\n\n`;
                    message += `📸 本次会话统计：\n`;
                    message += `• 已截图：${totalCaptured} 张\n`;
                    message += `• 已处理：${processed} 张\n`;
                    if (processing > 0) {
                        message += `• 正在处理：${processing} 张\n`;
                        message += `\n💡 提示：正在处理的截图会在完成后自动显示在工作记录中`;
                    }
                    if (duration > 0) {
                        const minutes = Math.floor(duration / 60);
                        const seconds = duration % 60;
                        message += `\n• 运行时长：${minutes}分${seconds}秒`;
                    }
                    
                    showMessage(message, 'success', 8000);  // 显示8秒，让用户有时间阅读
                    
                    // 显示浏览器通知
                    showNotification(
                        '⏹️ 自动截图已停止',
                        `已截图 ${totalCaptured} 张，${processing > 0 ? `正在处理 ${processing} 张` : '已全部处理完成'}`,
                        'screenshot-stopped'
                    );
                    
                    // 如果有正在处理的截图，定期更新统计信息
                    if (processing > 0) {
                        startStatsPolling();
                    }
                } else {
                    showMessage('自动截图已停止', 'success');
                    showNotification(
                        '⏹️ 自动截图已停止',
                        '截图功能已关闭',
                        'screenshot-stopped'
                    );
                }
            } catch (error) {
                console.error('停止自动截图错误:', error);
                showMessage(`停止失败: ${error.message}`, 'error');
                
                // 即使失败也尝试更新UI
                try {
                    updateAutoScreenshotUI(false, 0);
                } catch (uiError) {
                    console.error('更新UI失败:', uiError);
                }
            } finally {
                // 恢复按钮状态（如果停止失败）
                const currentStopBtn = document.getElementById('stop-auto-btn');
                if (currentStopBtn && currentStopBtn.style.display !== 'none') {
                    currentStopBtn.disabled = false;
                    currentStopBtn.textContent = originalText || '停止';
                }
            }
        }

        // 更新自动截图UI状态
        function updateAutoScreenshotUI(running, interval) {
            const statusEl = document.getElementById('auto-screenshot-status');
            const startBtn = document.getElementById('start-auto-btn');
            const stopBtn = document.getElementById('stop-auto-btn');
            const intervalInput = document.getElementById('screenshot-interval');

            if (running) {
                // 格式化间隔时间显示
                const minutes = Math.floor(interval / 60);
                const seconds = interval % 60;
                let intervalText = '';
                if (minutes > 0) {
                    intervalText = `${minutes}分钟`;
                    if (seconds > 0) {
                        intervalText += `${seconds}秒`;
                    }
                } else {
                    intervalText = `${seconds}秒`;
                }
                
                statusEl.innerHTML = `<span class="icon icon-running"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle></svg></span> 运行中 (间隔: ${intervalText})`;
                statusEl.style.color = '#28a745';
                statusEl.style.fontWeight = '500';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                stopBtn.disabled = false;
                stopBtn.textContent = '停止';
                intervalInput.disabled = true;
                intervalInput.style.backgroundColor = '#f0f0f0';
            } else {
                statusEl.textContent = '⚪ 未启用';
                statusEl.style.color = '#999';
                statusEl.style.fontWeight = 'normal';
                startBtn.style.display = 'inline-block';
                startBtn.disabled = false;
                startBtn.textContent = '启动';
                stopBtn.style.display = 'none';
                intervalInput.disabled = false;
                intervalInput.style.backgroundColor = 'white';
                // 未运行时，如果有正在处理的截图，仍然显示统计信息
                const statsEl = document.getElementById('screenshot-stats');
                const processingEl = document.getElementById('stats-processing');
                if (statsEl && processingEl && parseInt(processingEl.textContent) > 0) {
                    statsEl.style.display = 'block';
                } else if (statsEl) {
                    // 如果没有正在处理的，隐藏统计信息
                    statsEl.style.display = 'none';
                }
            }
        }

        // 统计信息轮询（用于更新正在处理的截图数量）
        let statsPollingInterval = null;
        
        function startStatsPolling() {
            // 如果已经有轮询在运行，先清除
            if (statsPollingInterval) {
                clearInterval(statsPollingInterval);
            }
            
            // 每3秒更新一次统计信息
            statsPollingInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/screenshot/auto/status');
                    if (response.ok) {
                        const status = await response.json();
                        if (status.stats) {
                            updateScreenshotStats(status.stats);
                            
                            // 如果没有正在处理的截图了，停止轮询
                            if (status.stats.processing === 0) {
                                clearInterval(statsPollingInterval);
                                statsPollingInterval = null;
                                
                                // 隐藏统计信息（如果没有正在处理的）
                                const statsEl = document.getElementById('screenshot-stats');
                                if (statsEl) {
                                    statsEl.style.display = 'none';
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('更新统计信息错误:', error);
                }
            }, 3000);  // 每3秒更新一次
        }
        
        function stopStatsPolling() {
            if (statsPollingInterval) {
                clearInterval(statsPollingInterval);
                statsPollingInterval = null;
            }
        }
        
        // 更新统计信息显示
        function updateScreenshotStats(stats) {
            // 更新统计信息显示
            if (!stats) return;
            
            const totalEl = document.getElementById('stats-total');
            const processedEl = document.getElementById('stats-processed');
            const processingEl = document.getElementById('stats-processing');
            const queueSizeEl = document.getElementById('stats-queue-size');
            const queueContainerEl = document.getElementById('stats-queue-container');
            const currentProcessingEl = document.getElementById('stats-current-processing');
            const currentFileEl = document.getElementById('stats-current-file');
            
            if (totalEl) totalEl.textContent = stats.total_captured || 0;
            if (processedEl) processedEl.textContent = stats.processed || 0;
            
            const processing = stats.processing || 0;
            const queueSize = stats.queue_size || 0;
            const currentProcessing = stats.current_processing;
            
            // 显示/隐藏处理状态容器
            const processingContainer = document.getElementById('stats-processing-container');
            if (processingContainer) {
                if (processing > 0 || queueSize > 0) {
                    processingContainer.style.display = 'block';
                } else {
                    processingContainer.style.display = 'none';
                }
            }
            
            if (processingEl) processingEl.textContent = processing;
            
            // 显示队列信息
            if (queueSizeEl) queueSizeEl.textContent = queueSize;
            if (queueContainerEl) {
                if (queueSize > 0) {
                    queueContainerEl.style.display = 'inline';
                } else {
                    queueContainerEl.style.display = 'none';
                }
            }
            
            // 显示当前处理的文件
            if (currentFileEl && currentProcessing) {
                currentFileEl.textContent = currentProcessing;
                if (currentProcessingEl) {
                    currentProcessingEl.style.display = 'block';
                }
            } else if (currentProcessingEl) {
                currentProcessingEl.style.display = 'none';
            }
        }
        
        // 原有的 updateScreenshotStats 函数（如果存在）
        function updateScreenshotStats_old(stats) {
            const totalEl = document.getElementById('stats-total');
            const processedEl = document.getElementById('stats-processed');
            const processingEl = document.getElementById('stats-processing');
            const processingContainer = document.getElementById('stats-processing-container');
            const statsEl = document.getElementById('screenshot-stats');
            
            if (totalEl) totalEl.textContent = stats.total_captured || 0;
            if (processedEl) processedEl.textContent = stats.processed || 0;
            if (processingEl) processingEl.textContent = stats.processing || 0;
            
            // 如果有正在处理的截图，显示处理中提示
            if (processingContainer && stats.processing > 0) {
                processingContainer.style.display = 'block';
            } else if (processingContainer) {
                processingContainer.style.display = 'none';
            }
            
            // 如果有统计信息，显示统计区域
            if (statsEl && (stats.total_captured > 0 || stats.processing > 0)) {
                statsEl.style.display = 'block';
            }
        }
        
        // 获取自动截图状态
        async function loadAutoScreenshotStatus() {
            try {
                const response = await fetch('/api/screenshot/auto/status');
                if (response.ok) {
                    const status = await response.json();
                    updateAutoScreenshotUI(status.running, status.interval);
                    
                    // 如果有统计信息，更新显示
                    if (status.stats) {
                        updateScreenshotStats(status.stats);
                        
                        // 如果有正在处理的截图，启动轮询
                        if (status.stats.processing > 0) {
                            startStatsPolling();
                        }
                    }
                }
            } catch (error) {
                console.error('获取自动截图状态错误:', error);
            }
        }

        // 快捷键支持：Ctrl+Shift+S 停止截图
        // 使用 window 级别的事件监听，确保全局可用
        window.addEventListener('keydown', (e) => {
            // Ctrl+Shift+S 或 Cmd+Shift+S (Mac)
            const isCtrlOrCmd = e.ctrlKey || e.metaKey;
            const isShift = e.shiftKey;
            // 检查按键（不区分大小写）
            const isS = e.key === 'S' || e.key === 's' || e.keyCode === 83;
            
            if (isCtrlOrCmd && isShift && isS) {
                // 阻止默认行为（避免浏览器快捷键冲突）
                e.preventDefault();
                e.stopPropagation();
                
                console.log('快捷键 Ctrl+Shift+S 被按下');
                
                // 检查是否正在运行（多种方式检查）
                const statusEl = document.getElementById('auto-screenshot-status');
                const stopBtn = document.getElementById('stop-auto-btn');
                // 检查停止按钮是否可见
                const isRunning = stopBtn && 
                    stopBtn.style.display !== 'none' && 
                    stopBtn.offsetParent !== null;
                const isCountdown = countdownTimer !== null;
                const statusText = statusEl?.textContent || '';
                const hasRunningText = statusText.includes('运行中');
                
                console.log('状态检查:', { 
                    statusText, 
                    isRunning, 
                    isCountdown,
                    hasRunningText,
                    stopBtnDisplay: stopBtn?.style.display,
                    stopBtnVisible: stopBtn?.offsetParent !== null
                });
                
                // 如果正在运行、倒计时中、或者状态文本包含"运行中"，都执行停止
                if (isRunning || isCountdown || hasRunningText) {
                    console.log('执行停止操作');
                    stopAutoScreenshot();
                    // 不在这里显示消息，让 stopAutoScreenshot 自己显示
                } else {
                    console.log('截图未在运行，忽略快捷键');
                }
            }
        }, true); // 使用捕获阶段，确保能捕获到事件，即使输入框聚焦也能工作

        // 页面加载时自动加载记录
        window.addEventListener('DOMContentLoaded', async () => {
            // 初始化工作记录日历（默认选择今天）
            const today = new Date().toISOString().split('T')[0];
            recordCalendarState.selectedDate = today;
            updateRecordCalendarDisplay();
            
            // 初始化两个日历
            await initRecordCalendar();
            initCalendar();
            
            // 加载今天的记录
            loadRecords();
            
            loadAutoScreenshotStatus();
            // 请求通知权限
            requestNotificationPermission();
            // 启动定时轮询检查新记录
            startRecordsPolling();
        });
        
        // 页面卸载时停止轮询
        window.addEventListener('beforeunload', () => {
            stopRecordsPolling();
        });
        
        // 日期选择器变化时重置轮询（已迁移到日历选择器，此代码已废弃）

        // 页面可见性变化时，如果截图正在运行，显示通知提醒
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // 页面隐藏时，检查截图状态
                const statusEl = document.getElementById('auto-screenshot-status');
                if (statusEl && statusEl.textContent.includes('运行中')) {
                    // 获取间隔时间
                    const interval = parseInt(document.getElementById('screenshot-interval').value) || 5;
                    const minutes = Math.floor(interval / 60);
                    const seconds = interval % 60;
                    let intervalText = '';
                    if (minutes > 0) {
                        intervalText = `${minutes}分钟`;
                        if (seconds > 0) {
                            intervalText += `${seconds}秒`;
                        }
                    } else {
                        intervalText = `${seconds}秒`;
                    }
                    
                    showNotification(
                        '自动截图运行中',
                        `截图间隔: ${intervalText}`,
                        'screenshot-running'
                    );
                }
            }
        });
    </script>
