            </svg>`,
            // 文件图标
            file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
            </svg>`,
            // 加载/等待图标
            loading: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>`,
            // 整合/链接图标
            consolidate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>`,
            // 编辑图标
            edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>`,
            // 删除图标
            delete: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>`,
            // 保存图标
            save: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>`,
            // 取消/关闭图标
            cancel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>`
        };

        // 创建图标HTML的函数
        function icon(name, size = 'normal') {
            const sizeClass = size === 'large' ? 'icon-large' : size === 'small' ? 'icon-small' : '';
            return `<span class="icon ${sizeClass}">${Icons[name] || ''}</span>`;
        }

        // 上传的文件列表
        let uploadedFiles = [];

        // 初始化日期选择器为今天（已迁移到日历选择器，此代码已废弃）

        // 显示消息
        function showMessage(message, type = 'success') {
            const container = document.getElementById('message-container');
            const className = type === 'error' ? 'error-message' : 'success-message';
            container.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // 获取文件图标
        function getFileIcon(fileName, type) {
            if (type === 'image') {
                return icon('image');
            }
            const ext = fileName.split('.').pop().toLowerCase();
            const iconMap = {
                'pdf': icon('file'),
                'docx': icon('file'),
                'doc': icon('file'),
                'txt': icon('file'),
                'md': icon('document'),
                'json': icon('list')
            };
            return iconMap[ext] || icon('file');
        }

        // 处理文件选择
        function handleFileSelect(event, type) {
            const files = Array.from(event.target.files);
            addFiles(files, type);
            event.target.value = ''; // 重置input，允许重复选择同一文件
        }

        // 处理拖拽
        function handleDragOver(event) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove('dragover');
            
            const files = Array.from(event.dataTransfer.files);
            const imageExts = ['.jpg', '.jpeg', '.png', '.bmp', '.gif', '.tiff', '.webp'];
            const docExts = ['.pdf', '.docx', '.txt', '.md', '.json'];
            
            files.forEach(file => {
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                if (imageExts.includes(ext)) {
                    addFiles([file], 'image');
                } else if (docExts.includes(ext)) {
                    addFiles([file], 'document');
                } else {
                    showMessage(`不支持的文件格式: ${ext}`, 'error');
                }
            });
        }

        // 添加文件到列表
        function addFiles(files, type) {
            files.forEach(file => {
                // 检查文件大小（限制为50MB）
                if (file.size > 50 * 1024 * 1024) {
                    showMessage(`文件 ${file.name} 过大（超过50MB）`, 'error');
                    return;
                }
                
                uploadedFiles.push({
                    file: file,
                    type: type,
                    id: Date.now() + Math.random()
                });
            });
            updateFileList();
        }

        // 移除文件
        function removeFile(id) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== id);
            updateFileList();
        }

        // 更新文件列表显示（显示在文本框下方）
        function updateFileList() {
            const fileListInline = document.getElementById('file-list-inline');
            if (!fileListInline) {
                return; // 如果元素不存在，直接返回
            }
            
            if (uploadedFiles.length === 0) {
                fileListInline.innerHTML = '';
                fileListInline.style.display = 'none';
                return;
            }
            
            fileListInline.style.display = 'flex';
            fileListInline.innerHTML = uploadedFiles.map(f => `
                <div class="file-item">
                    <div class="file-item-info">
                        <span class="file-icon">${getFileIcon(f.file.name, f.type)}</span>
                        <span class="file-name" title="${f.file.name}">${f.file.name}</span>
                        <span class="file-size">${formatFileSize(f.file.size)}</span>
                        <span style="font-size: 11px; color: #667eea; margin-left: 4px;">${f.type === 'image' ? '图片' : '文档'}</span>
                    </div>
                    <button class="file-remove" onclick="removeFile(${f.id})" title="删除">×</button>
                </div>
            `).join('');
        }

        // 清空输入
        function clearInput() {
            const workInput = document.getElementById('work-input');
            if (workInput) {
                workInput.value = '';
            }
            uploadedFiles = [];
            updateFileList();
            
            // 确保文件输入也被清除
            const documentInput = document.getElementById('document-input');
            const imageInput = document.getElementById('image-input');
            if (documentInput) documentInput.value = '';
            if (imageInput) imageInput.value = '';
        }

        // 提交工作记录
        async function submitWorkRecord() {
            const input = document.getElementById('work-input').value.trim();
            const hasFiles = uploadedFiles.length > 0;
            
            if (!input && !hasFiles) {
                showMessage('请输入工作内容或上传文件', 'error');
                return;
            }

            try {
                showMessage('正在提交...', 'success');
                
                // 保存要提交的内容（在清除前保存）
                const textToSubmit = input;
                const filesToSubmit = hasFiles ? [...uploadedFiles] : [];
                
                // 立即清除输入和文件（不等待后端处理）
                clearInput();
                showMessage('记录已提交，正在后台处理...', 'success');
                
                // 异步提交（不阻塞UI）
                if (hasFiles) {
                    // 提交文件（异步，不等待完成）
                    submitFilesAsync(filesToSubmit, textToSubmit).catch(error => {
                        console.error('文件提交错误:', error);
                        showMessage(`提交失败: ${error.message}`, 'error');
                    });
                } else if (textToSubmit) {
                    // 提交文本（异步，不等待完成）
                    submitTextAsync(textToSubmit).catch(error => {
                        console.error('文本提交错误:', error);
                        showMessage(`提交失败: ${error.message}`, 'error');
                    });
                }
                
                // 延迟刷新记录列表（给后端一些处理时间）
                setTimeout(() => {
                    loadRecords();
                }, 1000);
            } catch (error) {
                console.error('提交错误:', error);
                showMessage(`提交失败: ${error.message}`, 'error');
            }
        }
        
        // 异步提交文件（不阻塞UI）
        async function submitFilesAsync(filesToSubmit, textInput) {
            for (const fileItem of filesToSubmit) {
                const formData = new FormData();
                formData.append('file', fileItem.file);
                formData.append('type', fileItem.type);
                formData.append('timestamp', new Date().toISOString());
                if (textInput) {
                    formData.append('text_content', textInput);
                }
                
                const response = await fetch('/api/work-records/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({ error: '未知错误' }));
                    throw new Error(`文件 ${fileItem.file.name} 上传失败: ${error.error || '未知错误'}`);
                }
            }
        }
        
        // 异步提交文本（不阻塞UI）
        async function submitTextAsync(textInput) {
            const response = await fetch('/api/work-records', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: textInput,
                    timestamp: new Date().toISOString()
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || '提交失败');
            }
        }

        // 提交文件（保留用于兼容性，但已改为使用submitFilesAsync）
        async function submitFiles() {
            // 获取用户输入的文本内容（如果有）
            const textInput = document.getElementById('work-input').value.trim();
            
            // 保存文件列表的副本，因为提交过程中可能会清除
            const filesToSubmit = [...uploadedFiles];
            
            await submitFilesAsync(filesToSubmit, textInput);
        }

        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 渲染记录卡片
        function renderRecordCard(record, isEditing = false) {
            const content = record.content || {};
            const timestamp = record.timestamp || '';
            const date = timestamp.split('T')[0];
            const time = timestamp.split('T')[1]?.substring(0, 5) || timestamp.split('T')[0];
            const recordId = `record-${timestamp.replace(/[:.]/g, '-')}`;

            // 如果是编辑模式
            if (isEditing) {
                return renderEditForm(record, date, timestamp);
            }

            let html = `
                <div class="record-card" id="${recordId}" data-timestamp="${timestamp}" data-date="${date}">
                    <div class="record-header">
                        <span class="record-time">${time}</span>
                        <div class="record-actions">
                            <button class="record-action-btn edit" onclick="editRecord('${date}', '${encodeURIComponent(timestamp)}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                                编辑
                            </button>
                            <button class="record-action-btn delete" onclick="deleteRecord('${date}', '${encodeURIComponent(timestamp)}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                                删除
                            </button>
                        </div>
                    </div>
            `;

            if (content.tasks && content.tasks.length > 0) {
                html += '<div class="record-tasks">';
                content.tasks.forEach(task => {
                    html += `<span class="task-tag">${task}</span>`;
                });
                html += '</div>';
            }

            if (content.work_content) {
                html += `<div class="record-content">${content.work_content}</div>`;
            }

            const hasDetails = content.achievements?.length || content.issues?.length || content.next_steps?.length;
            if (hasDetails) {
                html += '<div class="record-details">';
                
                if (content.achievements?.length > 0) {
                    html += '<section class="achievements">';
                    html += `<h4><span class="icon icon-success">${Icons.check}</span> 成果</h4><ul>`;
                    content.achievements.forEach(ach => {
                        // 支持字典格式的achievements
                        if (typeof ach === 'object' && ach !== null && !Array.isArray(ach)) {
                            // 如果是字典，格式化显示
                            let achText = '';
                            if (ach.title) {
                                achText += `<strong>${ach.title}</strong>`;
                            }
                            if (ach.description) {
                                achText += achText ? ': ' + ach.description : ach.description;
                            }
                            if (ach.impact) {
                                achText += ` (影响: ${ach.impact})`;
                            }
                            // 如果没有匹配到标准字段，显示所有字段
                            if (!achText) {
                                const parts = [];
                                for (const [key, value] of Object.entries(ach)) {
                                    if (value) {
                                        parts.push(`${key}: ${value}`);
                                    }
                                }
                                achText = parts.join(', ');
                            }
                            html += `<li>${achText || JSON.stringify(ach)}</li>`;
                        } else {
                            // 如果是字符串，直接显示
                        html += `<li>${ach}</li>`;
                        }
                    });
                    html += '</ul></section>';
                }

                if (content.issues?.length > 0) {
                    html += '<section class="issues">';
                    html += `<h4><span class="icon icon-warning">${Icons.warning}</span> 问题</h4><ul>`;
                    content.issues.forEach(issue => {
                        html += `<li>${issue}</li>`;
                    });
                    html += '</ul></section>';
                }

                if (content.next_steps?.length > 0) {
                    html += '<section class="next-steps">';
                    html += `<h4><span class="icon icon-info">${Icons.pin}</span> 下一步</h4><ul>`;
                    content.next_steps.forEach(step => {
                        html += `<li>${step}</li>`;
                    });
                    html += '</ul></section>';
                }

                html += '</div>';
            }

            html += '</div>';
            return html;
        }

        // 渲染编辑表单
        function renderEditForm(record, date, timestamp) {
            const content = record.content || {};
            const recordId = `record-${timestamp.replace(/[:.]/g, '-')}`;
            
            let html = `
                <div class="record-card editing" id="${recordId}" data-timestamp="${timestamp}" data-date="${date}">
                    <div class="edit-form">
                        <div class="edit-form-group">
                            <label>任务/项目（每行一个）</label>
                            <div class="tag-input" id="tasks-input-${recordId}">
                                ${(content.tasks || []).map(task => 
                                    `<span class="tag-item">${escapeHtml(task)}<span class="tag-remove" onclick="removeTag(this)">×</span></span>`
                                ).join('')}
                                <input type="text" placeholder="输入任务后按回车添加" onkeypress="handleTagInput(event, this, '${recordId}')">
                            </div>
                        </div>
                        
                        <div class="edit-form-group">
                            <label>工作内容</label>
                            <textarea id="work-content-${recordId}" placeholder="输入工作内容">${escapeHtml(content.work_content || '')}</textarea>
                        </div>
                        
                        <div class="edit-form-group">
                            <label>成果（每行一个）</label>
                            <textarea id="achievements-${recordId}" placeholder="输入成果，每行一个">${(content.achievements || []).map(ach => {
                                if (typeof ach === 'object' && ach !== null) {
                                    return `${ach.title || ''}: ${ach.description || ''}${ach.impact ? ` (影响: ${ach.impact})` : ''}`;
                                }
                                return ach;
                            }).join('\n')}</textarea>
                        </div>
                        
                        <div class="edit-form-group">
                            <label>问题（每行一个）</label>
                            <textarea id="issues-${recordId}" placeholder="输入问题，每行一个">${(content.issues || []).join('\n')}</textarea>
                        </div>
                        
                        <div class="edit-form-group">
                            <label>下一步计划（每行一个）</label>
                            <textarea id="next-steps-${recordId}" placeholder="输入下一步计划，每行一个">${(content.next_steps || []).join('\n')}</textarea>
                        </div>
                        
                        <div class="edit-form-actions">
                            <button class="btn-save" onclick="saveRecord('${date}', '${encodeURIComponent(timestamp)}', '${recordId}')">${icon('save')} 保存</button>
                            <button class="btn-cancel" onclick="cancelEdit('${date}', '${encodeURIComponent(timestamp)}')">${icon('cancel')} 取消</button>
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        // HTML转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 处理标签输入
        function handleTagInput(event, input, recordId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const value = input.value.trim();
                if (value) {
                    const tagHtml = `<span class="tag-item">${escapeHtml(value)}<span class="tag-remove" onclick="removeTag(this)">×</span></span>`;
                    input.insertAdjacentHTML('beforebegin', tagHtml);
                    input.value = '';
                }
            }
        }

        // 移除标签
        function removeTag(element) {
            element.closest('.tag-item').remove();
        }

        // 编辑记录
        function editRecord(date, timestamp) {
            // 设置编辑状态，暂停轮询更新
            isEditing = true;
            
            // 找到对应的记录卡片
            const recordCard = document.querySelector(`[data-date="${date}"][data-timestamp="${decodeURIComponent(timestamp)}"]`);
            if (!recordCard) {
                isEditing = false;
                return;
            }

            // 使用记录日历的选中日期，如果没有则使用传入的日期
            const selectedDate = recordCalendarState.selectedDate || date;
            
            // 重新加载记录并标记为编辑模式
            loadRecordsForEdit(selectedDate, timestamp);
        }

        // 为编辑加载记录
        async function loadRecordsForEdit(date, editTimestamp) {
            const container = document.getElementById('records-container');
            const dateStr = date || new Date().toISOString().split('T')[0];
            
            try {
                // 先尝试从本地文件系统加载（与loadRecords保持一致）
                let response = await fetch(`/work_records/${dateStr}.json`);
                let records = null;
                
                if (response.ok) {
                    records = await response.json();
                } else {
                    // 如果本地文件不存在，尝试使用API
                    response = await fetch(`/api/work-records?date=${dateStr}`);
                    if (response.ok) {
                        records = await response.json();
                    } else {
                        throw new Error('加载失败');
                    }
                }
                
                if (!Array.isArray(records) || records.length === 0) {
                    showMessage('该日期暂无工作记录', 'error');
                    isEditing = false;
                    return;
                }
                
                // 找到要编辑的记录
                const record = records.find(r => r.timestamp === decodeURIComponent(editTimestamp));
                if (!record) {
                    showMessage('记录不存在', 'error');
                    isEditing = false;
                    return;
                }
                
                // 渲染所有记录，编辑的记录使用编辑模式
                records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                container.innerHTML = records.map(r => 
                    renderRecordCard(r, r.timestamp === decodeURIComponent(editTimestamp))
                ).join('');
                
                // 滚动到编辑的记录
                const editCard = document.querySelector(`[data-timestamp="${decodeURIComponent(editTimestamp)}"]`);
                if (editCard) {
                    editCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (error) {
                console.error('加载记录错误:', error);
                showMessage(`加载失败: ${error.message}`, 'error');
                isEditing = false;
            }
        }

        // 保存记录
        async function saveRecord(date, timestamp, recordId) {
            try {
                // 收集表单数据
                const tasks = Array.from(document.querySelectorAll(`#tasks-input-${recordId} .tag-item`))
                    .map(tag => tag.textContent.replace('×', '').trim())
                    .filter(t => t);
                
                const workContent = document.getElementById(`work-content-${recordId}`).value.trim();
                const achievementsText = document.getElementById(`achievements-${recordId}`).value.trim();
                const issuesText = document.getElementById(`issues-${recordId}`).value.trim();
                const nextStepsText = document.getElementById(`next-steps-${recordId}`).value.trim();
                
                // 解析achievements（支持多行）
                const achievements = achievementsText.split('\n')
                    .map(line => line.trim())
                    .filter(line => line)
                    .map(line => {
                        // 尝试解析格式：title: description (影响: impact)
                        const match = line.match(/^(.+?):\s*(.+?)(?:\s*\(影响:\s*(.+?)\))?$/);
                        if (match) {
                            return {
                                title: match[1].trim(),
                                description: match[2].trim(),
                                impact: match[3] ? match[3].trim() : undefined
                            };
                        }
                        return line; // 简单字符串
                    });
                
                // 解析issues和next_steps（每行一个）
                const issues = issuesText.split('\n').map(line => line.trim()).filter(line => line);
                const nextSteps = nextStepsText.split('\n').map(line => line.trim()).filter(line => line);
                
                const content = {
                    tasks: tasks,
                    work_content: workContent,
                    achievements: achievements,
                    issues: issues,
                    next_steps: nextSteps,
                    metadata: {
                        edited: true,
                        edit_time: new Date().toISOString()
                    }
                };
                
                // 发送更新请求
                const response = await fetch(`/api/work-records/${date}/${timestamp}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存失败');
                }
                
                // 取消编辑状态，恢复轮询
                isEditing = false;
                
                showMessage('记录已保存', 'success');
                
                // 重新加载记录
                setTimeout(() => {
                    loadRecords();
                }, 500);
            } catch (error) {
                console.error('保存记录错误:', error);
                showMessage(`保存失败: ${error.message}`, 'error');
                // 即使保存失败，也取消编辑状态
                isEditing = false;
            }
        }

        // 取消编辑
        function cancelEdit(date, timestamp) {
            // 取消编辑状态，恢复轮询
            isEditing = false;
            loadRecords();
        }

        // 整合相似记录
        async function consolidateRecords() {
